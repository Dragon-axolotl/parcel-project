<!DOCTYPE html><html lang="uk"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мій перший проєкт Parcel</title>
  <link rel="stylesheet" href="/parcel-project.3a01df49.css">
  <script type="module" src="/parcel-project.31b563d9.js"></script>
</head>
<body>
  <main class="app">
    <h1 class="app__title">Мій перший проєкт з Parcel</h1>

    <section class="greeting">
      <input class="greeting__input" id="name-input" type="text" placeholder="Введіть своє ім'я">

      <button class="greeting__button" id="greet-button">
        Привітатися
      </button>

      <p class="greeting__result" id="greeting-result"></p>
    </section>

    <section class="counter">
      <h2 class="counter__title">Лічильник</h2>

      <p class="counter__value" id="counter-value">0</p>

      <div class="counter__buttons">
        <button id="decrease-button">−</button>
        <button id="increase-button">+</button>
        <button id="reset-button">Скинути</button>
      </div>
    </section>
  </main>


</body></html>
